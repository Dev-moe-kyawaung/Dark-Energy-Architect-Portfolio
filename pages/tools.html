<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | Dark Energy Portfolio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="dark-energy-theme">
    <div class="cosmic-background">
        <div class="dark-energy-field"></div>
        <div class="gravitational-waves"></div>
    </div>
    
    <nav class="cosmic-navigation" id="mainNav">
        <!-- Same nav -->
    </nav>
    
    <main class="main-content">
        <section class="section-container" style="padding-top: 120px;">
            <div class="section-badge">Tools</div>
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">My Toolkit</h1>
            <p class="section-subtitle" style="margin-bottom: 3rem;">The tools and technologies I use daily</p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                <div style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 1.5rem;">
                    <h4>IDE</h4>
                    <p style="color: var(--text-secondary);">VS Code, IntelliJ, Vim</p>
                </div>
                <div style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 1.5rem;">
                    <h4>Terminal</h4>
                    <p style="color: var(--text-secondary);">iTerm2, tmux, zsh</p>
                </div>
                <div style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 1.5rem;">
                    <h4>Design</h4>
                    <p style="color: var(--text-secondary);">Figma, Excalidraw</p>
                </div>
                <div style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 1.5rem;">
                    <h4>Documentation</h4>
                    <p style="color: var(--text-secondary);">Notion, Obsidian</p>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="cosmic-footer">
        <!-- Same footer -->
    </footer>
    
    <script src="../js/gravitational-system.js"></script>
    <script src="../js/cosmic-pulses.js"></script>
    <script src="../js/dark-matter-panels.js"></script>
    <script src="../js/ai-assistant.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>

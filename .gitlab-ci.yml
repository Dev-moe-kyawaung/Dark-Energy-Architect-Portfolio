
# GitLab CI/CD for Dark Energy Portfolio
# Deploys to GitLab Pages

image: node:18

pages:
  stage: deploy
  script:
    - echo "Deploying Dark Energy Portfolio to GitLab Pages"
    - mkdir public
    - cp -r ./* public/
    - cp -r ./pages/* public/pages/ 2>/dev/null || true
    - cp -r ./css/* public/css/ 2>/dev/null || true
    - cp -r ./js/* public/js/ 2>/dev/null || true
    - cp -r ./assets/* public/assets/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
